[project]
name = "dzmm2sillytavern"
version = "0.1.0"
description = "DZMM JSON 与 SillyTavern JSONL 聊天记录双向转换工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=14,<15"]

[project.scripts]
dzmm2sillytavern = "dzmm2sillytavern.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
